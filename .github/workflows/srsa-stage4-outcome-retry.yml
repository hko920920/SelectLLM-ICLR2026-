name: SRSA CIFAR Stage 4 outcome-blind technical retry

on:
  push:
    branches:
      - research/srsa-cifar-audit
    paths:
      - "post_v20/srsa_cifar/SRSA_STAGE4_TECHNICAL_RETRY_AUTHORIZE_2026-08-16.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: srsa-cifar-stage4-technical-retry
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  SOURCE_RUN_ID: "31888204323"
  SOURCE_HEAD_SHA: "23dedb414875be0f9531d1bef0634ed546ffafdd"

jobs:
  outcome-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Guard outcome-blind technical authorization
        run: |
          set -euo pipefail
          test -f post_v20/srsa_cifar/SRSA_STAGE4_TECHNICAL_RETRY_AUTHORIZE_2026-08-16.json
          test ! -e post_v20/srsa_cifar/SRSA_STAGE4_RESULT_2026-08-15.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path(
              'post_v20/srsa_cifar/SRSA_STAGE4_TECHNICAL_RETRY_AUTHORIZE_2026-08-16.json'
          ).read_text(encoding='utf-8'))
          assert value['decision'] == 'AUTHORIZE_EXACT_STAGE4_TECHNICAL_RETRY'
          assert value['source_run_id'] == 31888204323
          assert value['source_head_sha'] == '23dedb414875be0f9531d1bef0634ed546ffafdd'
          boundary = value['information_boundary_after_failed_stage4_job']
          assert boundary['sealed_label_artifact_downloaded'] is False
          assert boundary['sealed_labels_accessed'] is False
          assert boundary['primary_outcome_opened'] is False
          assert boundary['deployment_outcome_opened'] is False
          assert boundary['selector_executed'] is False
          assert value['scientific_settings_changed'] is False
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned outcome runtime
        run: python -m pip install --disable-pip-version-check numpy==1.26.4

      - name: Download exact Stage 0 lock from the source run
        uses: actions/download-artifact@v4
        with:
          name: srsa-stage0-final-lock
          path: locks/stage0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31888204323

      - name: Download exact Stage 1 lock from the source run
        uses: actions/download-artifact@v4
        with:
          name: srsa-stage1-final-lock
          path: locks/stage1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31888204323

      - name: Download exact Stage 2 lock from the source run
        uses: actions/download-artifact@v4
        with:
          name: srsa-stage2-final-lock
          path: locks/stage2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31888204323

      - name: Download exact Stage 3 pre-outcome artifact from the source run
        uses: actions/download-artifact@v4
        with:
          name: srsa-stage3-preoutcome
          path: stage3_preoutcome
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31888204323

      - name: Download exact endpoint artifacts from the source run
        uses: actions/download-artifact@v4
        with:
          pattern: cifar*
          path: stage2_endpoints
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31888204323

      - name: Verify every pre-outcome artifact before any label download
        run: |
          set -euo pipefail
          test -f locks/stage0/SRSA_STAGE0_FINAL_LOCK_2026-08-15.json
          test -f locks/stage1/SRSA_STAGE1_FINAL_LOCK_2026-08-15.json
          test -f locks/stage2/SRSA_STAGE2_FINAL_LOCK_2026-08-15.json
          test -f stage3_preoutcome/stage3_out/SRSA_STAGE3_PREOUTCOME_LOCK.json
          test -f stage3_preoutcome/stage3_out/cifar100/preoutcome.npz
          test -f stage3_preoutcome/stage3_out/cifar10/preoutcome.npz
          test ! -e stage1_sealed
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('stage3_preoutcome/stage3_out/SRSA_STAGE3_PREOUTCOME_LOCK.json')
          value = json.loads(p.read_text(encoding='utf-8'))
          assert value['decision'] == 'PASS_SRSA_STAGE3_PREOUTCOME'
          assert value['failed_gates'] == []
          boundary = value['information_boundary']
          assert boundary['sealed_label_artifact_downloaded'] is False
          assert boundary['sealed_labels_accessed'] is False
          assert boundary['labels_accessed'] is False
          assert boundary['selector_executed'] is False
          assert boundary['candidate_quality_computed'] is False
          assert boundary['primary_or_deployment_outcome_opened'] is False
          assert value['tasks']['cifar100']['canary']['gate_pass'] is True
          assert value['tasks']['cifar10']['canary']['gate_pass'] is True
          PY

      - name: Download sealed labels only after the Stage 3 PASS verification
        uses: actions/download-artifact@v4
        with:
          name: srsa-stage1-sealed-labels
          path: stage1_sealed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31888204323

      - id: result
        name: Open labels once and execute every frozen condition
        run: |
          set -euo pipefail
          python post_v20/srsa_cifar/srsa_stage4_outcome.py \
            --config post_v20/srsa_cifar/SRSA_CONFIG_2026-08-14.json \
            --stage0-lock locks/stage0/SRSA_STAGE0_FINAL_LOCK_2026-08-15.json \
            --stage1-lock locks/stage1/SRSA_STAGE1_FINAL_LOCK_2026-08-15.json \
            --stage2-lock locks/stage2/SRSA_STAGE2_FINAL_LOCK_2026-08-15.json \
            --stage3-lock stage3_preoutcome/stage3_out/SRSA_STAGE3_PREOUTCOME_LOCK.json \
            --stage1-sealed-root stage1_sealed \
            --endpoints-root stage2_endpoints \
            --preoutcome-root stage3_preoutcome/stage3_out \
            --stage3-commit "${SOURCE_HEAD_SHA}" \
            --output stage4_out \
            2>&1 | tee srsa-stage4-technical-retry.log
          decision=$(python -c "import json; print(json.load(open('stage4_out/SRSA_STAGE4_RESULT.json'))['decision'])")
          case "$decision" in
            GO_SRSA_PRIMARY|NO_GO_SRSA_PRIMARY) ;;
            *) echo "invalid literal decision: $decision" >&2; exit 1 ;;
          esac
          python - <<'PY'
          import json
          value = json.load(open('stage4_out/SRSA_STAGE4_RESULT.json'))
          assert value['information_boundary']['stage3_lock_verified_before_label_read'] is True
          assert value['information_boundary']['sealed_labels_opened'] is True
          assert value['information_boundary']['label_opening_jobs'] == 1
          assert value['information_boundary']['all_four_roots_executed_and_reported'] is True
          assert value['replication_cannot_rescue_primary'] is True
          assert value['no_third_task'] is True
          PY
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Upload the authoritative literal Stage 4 decision
        uses: actions/upload-artifact@v4
        with:
          name: srsa-stage4-result-technical-retry
          path: |
            stage4_out/SRSA_STAGE4_RESULT.json
            stage4_out/SRSA_STAGE4_PAIRED_RUNS.npz
            srsa-stage4-technical-retry.log
            post_v20/srsa_cifar/SRSA_STAGE4_TECHNICAL_RETRY_AUTHORIZE_2026-08-16.json
          if-no-files-found: error
          retention-days: 90
