name: SRSA Stage 1 public inputs and sealed labels

on:
  push:
    branches:
      - research/srsa-cifar-audit
    paths:
      - "post_v20/srsa_cifar/SRSA_STAGE1_AUTHORIZE_2026-08-14.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srsa-stage1-data-seal
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Stage 1 runtime
        run: python -m pip install --disable-pip-version-check numpy==1.26.4

      - name: Create public input partitions and physically separate label seal
        run: |
          set -euo pipefail
          python post_v20/srsa_cifar/srsa_stage1_data_seal.py \
            --config post_v20/srsa_cifar/SRSA_CONFIG_2026-08-14.json \
            --stage0-lock post_v20/srsa_cifar/SRSA_STAGE0_FINAL_LOCK_2026-08-14.json \
            --output srsa_stage1 \
            2>&1 | tee srsa-stage1.log

      - name: Assert public and sealed boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          receipt = json.loads(Path('srsa_stage1/SRSA_STAGE1_DATA_SEAL_RECEIPT.json').read_text(encoding='utf-8'))
          assert receipt['decision'] == 'PASS_SRSA_STAGE1_DATA_SEAL'
          boundary = receipt['information_boundary']
          assert boundary['labels_written_to_public_artifact'] is False
          assert boundary['model_tensor_loaded'] is False
          assert boundary['model_inference_executed'] is False
          assert boundary['candidate_prediction_accessed'] is False
          assert boundary['selector_executed'] is False
          assert boundary['primary_or_deployment_outcome_opened'] is False
          for task in ('cifar100', 'cifar10'):
              with np.load(f'srsa_stage1/public/{task}/inputs.npz', allow_pickle=False) as value:
                  assert 'labels' not in value.files
                  assert set(value.files) == {
                      'images', 'uids', 'image_sha256', 'partition_sha256',
                      'archive_positions', 'partition_codes'
                  }
              with np.load(f'srsa_stage1/sealed/{task}/labels.npz', allow_pickle=False) as value:
                  assert set(value.files) == {'uids', 'partition_codes', 'labels'}
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: srsa-stage1-public-inputs
          path: srsa_stage1/public/
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: srsa-stage1-sealed-labels
          path: srsa_stage1/sealed/
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: srsa-stage1-data-seal-receipt
          path: |
            srsa_stage1/SRSA_STAGE1_DATA_SEAL_RECEIPT.json
            srsa-stage1.log
          if-no-files-found: error
          retention-days: 90
