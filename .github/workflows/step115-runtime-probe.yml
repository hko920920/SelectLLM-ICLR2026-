name: Step 115 runtime probe

on:
  push:
    branches:
      - research/step115-direct-deployment
    paths:
      - ".github/workflows/step115-runtime-probe.yml"
      - "post_v20/step115/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step115-runtime-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout repository and Git LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Verify Git LFS materialization
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull
          test -f artifact_v20/step92_models/step92_clean_root_00.safetensors
          bytes=$(wc -c < artifact_v20/step92_models/step92_clean_root_00.safetensors)
          echo "materialized_bytes=${bytes}"
          test "${bytes}" -gt 1000

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-current.txt

      - name: Install probe dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==1.26.4
          pypdf
          huggingface-hub==0.34.5

      - name: Verify DNS and pinned Hugging Face model access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p post_v20/step115/runtime_probe
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import socket
          from pathlib import Path

          from huggingface_hub import hf_hub_download

          expected = "5e3f1108e3cb34ee048634875d8482665b65ac713291a7e32396fb18f6ff0063"
          host = "huggingface.co"
          resolved = sorted({row[4][0] for row in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
          model_path = Path(
              hf_hub_download(
                  repo_id="distilbert/distilbert-base-uncased",
                  filename="model.safetensors",
                  revision="12040accade4e8a0f71eabdb258fecc2e7e948be",
              )
          )
          digest = hashlib.sha256(model_path.read_bytes()).hexdigest()
          if digest != expected:
              raise AssertionError({"expected": expected, "observed": digest})
          lfs_path = Path("artifact_v20/step92_models/step92_clean_root_00.safetensors")
          payload = {
              "verdict": "PASS_STEP115_RUNTIME_NETWORK_AND_LFS_PROBE",
              "dns_host": host,
              "resolved_addresses": resolved,
              "distilbert_model_sha256": digest,
              "distilbert_model_bytes": model_path.stat().st_size,
              "lfs_probe_path": str(lfs_path),
              "lfs_probe_bytes": lfs_path.stat().st_size,
          }
          output = Path("post_v20/step115/runtime_probe/runtime_probe.json")
          output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2))
          PY

      - name: Run authoritative V20 clean-checkout audit
        shell: bash
        run: |
          set +e
          python artifact_v20/validate_step105_anonymous_release.py --integrity-only \
            2>&1 | tee post_v20/step115/runtime_probe/integrity.log
          status=${PIPESTATUS[0]}
          echo "${status}" > post_v20/step115/runtime_probe/integrity_status.txt
          exit 0

      - name: Classify V20 clean-checkout audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path("post_v20/step115/runtime_probe")
          log = (root / "integrity.log").read_text(encoding="utf-8", errors="replace")
          status = int((root / "integrity_status.txt").read_text(encoding="utf-8").strip())
          manifest = json.loads(Path("artifact_v20/STEP105_RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          relative = "paper_draft/__pycache__/validate_paper_tables.cpython-311.pyc"
          expected_error = f"AssertionError: {{'missing': '{relative}'}}"
          record = manifest["files"].get(relative)

          if status == 0:
              verdict = "PASS_V20_INTEGRITY_ON_CLEAN_CHECKOUT"
          elif expected_error in log and record == {
              "bytes": 75786,
              "sha256": "616b9d17fc37afbcbb190472f30c356f9a58b46daf1b531bb7d8fedef263faf5",
              "role": "manuscript_or_validation_source",
          }:
              verdict = "KNOWN_V20_GIT_EXTRACTION_GAP_MANIFEST_REFERENCES_IGNORED_PYC"
          else:
              raise SystemExit(
                  "Unexpected V20 integrity failure; inspect runtime probe artifact."
              )

          payload = {
              "verdict": verdict,
              "validator_exit_status": status,
              "historical_artifact_modified": False,
              "missing_manifest_entry": relative if status else None,
              "manifest_record": record if status else None,
              "interpretation": (
                  "The validated ZIP may contain the byte-bound pyc, but the Git extraction omits it "
                  "because __pycache__ and *.pyc are ignored. This does not block the GitHub Actions "
                  "runtime, LFS, or pinned-model download path."
                  if status
                  else "The clean Git checkout contains every byte required by the V20 manifest."
              ),
          }
          (root / "v20_clean_checkout_audit.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(payload, indent=2))
          PY

      - name: Upload probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step115-runtime-probe
          path: post_v20/step115/runtime_probe/
          if-no-files-found: warn
          retention-days: 30
