name: PRAA Stage 3 error heads and thresholds

on:
  push:
    branches:
      - research/praa-admission-audit
    paths:
      - "post_v20/praa_registry_admission/PRAA_STAGE2_FINAL_LOCK_2026-08-14.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: praa-stage3-error-heads
  cancel-in-progress: false

jobs:
  task:
    name: learned-${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task:
          - emotion
          - language_identification
    env:
      HF_HOME: /tmp/praa-stage3-huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout frozen Stage-3 code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Stage-1 public inputs
        uses: actions/download-artifact@v4
        with:
          name: praa-stage1-public-artifact-and-inputs
          path: stage1_public
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31775680237

      - name: Download Stage-2 endpoint receipts
        uses: actions/download-artifact@v4
        with:
          pattern: praa-stage2-safety-*
          path: stage2_predictions
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31776356942

      - name: Download Stage-2 authoritative ledger
        uses: actions/download-artifact@v4
        with:
          name: praa-stage2-clean-safety-and-parent-ledger
          path: stage2_ledger
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31776356942

      - name: Install frozen learned-endpoint runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            torch==2.6.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            scipy==1.16.1 \
            transformers==4.56.2 \
            tokenizers==0.22.2 \
            safetensors==0.8.0 \
            sentencepiece==0.2.0 \
            datasets==5.0.1 \
            pyarrow==25.0.0 \
            huggingface-hub==0.34.5 \
            fasttext-wheel==0.9.2
          mkdir -p /tmp/praa-langid-dist
          python -m pip download --disable-pip-version-check \
            --no-deps --no-binary=:all: \
            langid==1.1.6 \
            -d /tmp/praa-langid-dist
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('/tmp/praa-langid-dist/langid-1.1.6.tar.gz')
          expected = '044bcae1912dab85c33d8e98f2811b8f4ff1213e5e9a9e9510137b84da2cb293'
          observed = hashlib.sha256(path.read_bytes()).hexdigest()
          if observed != expected:
              raise SystemExit({'expected': expected, 'observed': observed})
          PY
          python -m pip install --disable-pip-version-check \
            /tmp/praa-langid-dist/langid-1.1.6.tar.gz

      - name: Build four frozen learned endpoints without outcome access
        shell: bash
        run: |
          set +e
          mkdir -p stage3_out
          python post_v20/praa_registry_admission/stage3_build_task.py \
            --task "${{ matrix.task }}" \
            --stage1-public-root stage1_public \
            --stage2-ledger stage2_ledger/PRAA_STAGE2_CLEAN_SAFETY_AND_PARENT_LEDGER.json \
            --stage2-predictions-root stage2_predictions \
            --output-root stage3_out \
            2>&1 | tee "stage3-${{ matrix.task }}.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "${status}" > "stage3-${{ matrix.task }}.status"
          exit "${status}"

      - name: Upload task receipt, checkpoints, and arrays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: praa-stage3-${{ matrix.task }}
          path: |
            stage3_out/
            stage3-${{ matrix.task }}.log
            stage3-${{ matrix.task }}.status
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  finalize:
    name: family-closure
    needs: task
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen closure code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download task receipts from this run
        uses: actions/download-artifact@v4
        with:
          pattern: praa-stage3-*
          path: stage3_receipts
          merge-multiple: true

      - name: Download Stage-2 authoritative ledger
        uses: actions/download-artifact@v4
        with:
          name: praa-stage2-clean-safety-and-parent-ledger
          path: stage2_ledger
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31776356942

      - name: Close the simultaneous two-task family
        shell: bash
        run: |
          set +e
          mkdir -p stage3_closure
          python post_v20/praa_registry_admission/stage3_finalize.py \
            --receipts-root stage3_receipts \
            --stage1-lock post_v20/praa_registry_admission/PRAA_STAGE1_ARTIFACT_AND_DATA_SEAL_LOCK_2026-08-14.json \
            --stage2-ledger stage2_ledger/PRAA_STAGE2_CLEAN_SAFETY_AND_PARENT_LEDGER.json \
            --output-dir stage3_closure \
            2>&1 | tee stage3_closure/execution.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "${status}" > stage3_closure/exit_status.txt
          exit "${status}"

      - name: Upload Stage-3 family closure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: praa-stage3-family-closure
          path: stage3_closure/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
