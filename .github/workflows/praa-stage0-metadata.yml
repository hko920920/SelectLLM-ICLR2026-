name: PRAA Stage 0 public metadata screen

on:
  push:
    branches:
      - research/praa-admission-audit
    paths:
      - ".github/workflows/praa-stage0-metadata.yml"
      - "post_v20/praa_registry_admission/PRAA_STAGE0_METADATA_PROTOCOL_2026-08-14.md"
      - "post_v20/praa_registry_admission/screen_public_metadata.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: praa-stage0-metadata
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install metadata-only dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Execute metadata-only task and registry screen
        id: screen
        shell: bash
        run: |
          set +e
          mkdir -p post_v20/praa_registry_admission/stage0_receipt
          python post_v20/praa_registry_admission/screen_public_metadata.py \
            --output-dir post_v20/praa_registry_admission/stage0_receipt \
            2>&1 | tee post_v20/praa_registry_admission/stage0_receipt/execution.log
          status=${PIPESTATUS[0]}
          echo "exit_status=${status}" | tee post_v20/praa_registry_admission/stage0_receipt/status.txt
          exit "${status}"

      - name: Upload Stage-0 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: praa-stage0-public-metadata-screen
          path: post_v20/praa_registry_admission/stage0_receipt/
          if-no-files-found: error
          retention-days: 90
