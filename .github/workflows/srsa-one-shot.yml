name: SRSA CIFAR final one-shot

on:
  push:
    branches:
      - research/srsa-final-clean
    paths:
      - "post_v20/srsa_cifar/SRSA_FINAL_ONE_SHOT_AUTHORIZE_2026-08-15.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: srsa-cifar-final-one-shot
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      decision: ${{ steps.preflight.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic preflight dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 pytest==8.3.5 PyYAML==6.0.2
      - id: preflight
        name: Validate the only authorized execution path
        run: |
          set -euo pipefail
          test -f post_v20/srsa_cifar/SRSA_FINAL_ONE_SHOT_AUTHORIZE_2026-08-15.json
          test -f post_v20/srsa_cifar/SRSA_STAGE0_FROZEN_RECEIPT_2026-08-14.json
          test ! -e post_v20/srsa_cifar/SRSA_STAGE4_RESULT_2026-08-15.json
          python -m compileall -q post_v20/srsa_cifar
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          import yaml
          config_path = Path('post_v20/srsa_cifar/SRSA_CONFIG_2026-08-14.json')
          receipt_path = Path('post_v20/srsa_cifar/SRSA_STAGE0_FROZEN_RECEIPT_2026-08-14.json')
          auth_path = Path('post_v20/srsa_cifar/SRSA_FINAL_ONE_SHOT_AUTHORIZE_2026-08-15.json')
          workflow_path = Path('.github/workflows/srsa-one-shot.yml')
          config = json.loads(config_path.read_text())
          receipt = json.loads(receipt_path.read_text())
          auth = json.loads(auth_path.read_text())
          workflow = yaml.safe_load(workflow_path.read_text())
          assert config['status'] == 'PREREGISTERED_BEFORE_CIFAR_EXECUTION'
          assert config['tasks']['cifar100']['role'] == 'primary'
          assert config['tasks']['cifar10']['role'] == 'replication_non_substitutable'
          assert config['closure']['no_third_task'] is True
          assert receipt['decision'] == 'PASS_SRSA_STAGE0_PUBLIC_METADATA'
          assert hashlib.sha256(config_path.read_bytes()).hexdigest() == receipt['config_sha256']
          assert hashlib.sha256(receipt_path.read_bytes()).hexdigest() == '77b845cbfe3f999730685f63609f3cf4c345d73bd73074516ea216caea485ead'
          boundary = receipt['information_boundary']
          assert boundary['dataset_rows_decoded'] is False
          assert boundary['labels_accessed'] is False
          assert boundary['cifar_predictions_accessed'] is False
          assert boundary['selector_executed'] is False
          assert boundary['primary_or_deployment_outcome_opened'] is False
          assert len(receipt['models']) == 8
          assert set(receipt['datasets']) == {'cifar100', 'cifar10'}
          assert auth['decision'] == 'AUTHORIZE_SRSA_CIFAR_FINAL_ONE_SHOT'
          assert auth['source_commit'] == 'be5bbdd7e438c8eae9f2a22a3c18ff668f759c70'
          observed_blob = subprocess.check_output(
              ['git', 'hash-object', str(workflow_path)], text=True
          ).strip()
          assert observed_blob == auth['workflow_git_blob_sha']
          assert auth['scientific_settings_changed'] is False
          assert isinstance(workflow, dict) and set(workflow['jobs']) == {
              'preflight', 'stage0-lock', 'stage1-seal', 'stage2-endpoint',
              'stage2-close', 'stage3-preoutcome', 'stage4-outcome'
          }
          PY
          (
            cd post_v20/srsa_cifar
            pytest -q test_srsa_core.py test_srsa_selector_fast.py \
              test_srsa_selector_frozen.py test_srsa_stage4_math.py
          )
          echo "decision=PASS_SRSA_FINAL_PREFLIGHT" >> "${GITHUB_OUTPUT}"

  stage0-lock:
    needs: preflight
    if: needs.preflight.outputs.decision == 'PASS_SRSA_FINAL_PREFLIGHT'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      decision: ${{ steps.lock.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - id: lock
        name: Materialize the frozen public-metadata lock
        run: |
          set -euo pipefail
          mkdir -p stage0_lock
          cp post_v20/srsa_cifar/SRSA_STAGE0_FROZEN_RECEIPT_2026-08-14.json \
            stage0_lock/SRSA_STAGE0_FINAL_LOCK_2026-08-14.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path('stage0_lock/SRSA_STAGE0_FINAL_LOCK_2026-08-14.json')
          value = json.loads(path.read_text())
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '77b845cbfe3f999730685f63609f3cf4c345d73bd73074516ea216caea485ead'
          assert value['decision'] == 'PASS_SRSA_STAGE0_PUBLIC_METADATA'
          PY
          echo "decision=PASS_SRSA_STAGE0_PUBLIC_METADATA" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: srsa-final-stage0-lock
          path: stage0_lock/SRSA_STAGE0_FINAL_LOCK_2026-08-14.json
          if-no-files-found: error
          retention-days: 90

  stage1-seal:
    needs: stage0-lock
    if: needs.stage0-lock.outputs.decision == 'PASS_SRSA_STAGE0_PUBLIC_METADATA'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      decision: ${{ steps.lock.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage0-lock
          path: locks/stage0
      - name: Create public inputs and the physically separate label seal
        run: |
          set -euo pipefail
          python post_v20/srsa_cifar/srsa_stage1_data_seal.py \
            --config post_v20/srsa_cifar/SRSA_CONFIG_2026-08-14.json \
            --stage0-lock locks/stage0/SRSA_STAGE0_FINAL_LOCK_2026-08-14.json \
            --output srsa_stage1 2>&1 | tee srsa-stage1.log
      - id: lock
        name: Validate the Stage 1 information boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, numpy as np
          from pathlib import Path
          value = json.loads(Path('srsa_stage1/SRSA_STAGE1_DATA_SEAL_RECEIPT.json').read_text())
          assert value['decision'] == 'PASS_SRSA_STAGE1_DATA_SEAL'
          boundary = value['information_boundary']
          assert boundary['labels_written_to_public_artifact'] is False
          assert boundary['model_tensor_loaded'] is False
          assert boundary['model_inference_executed'] is False
          assert boundary['candidate_prediction_accessed'] is False
          assert boundary['selector_executed'] is False
          assert boundary['primary_or_deployment_outcome_opened'] is False
          for task in ('cifar100', 'cifar10'):
              with np.load(f'srsa_stage1/public/{task}/inputs.npz', allow_pickle=False) as arrays:
                  assert 'labels' not in arrays.files
              with np.load(f'srsa_stage1/sealed/{task}/labels.npz', allow_pickle=False) as arrays:
                  assert set(arrays.files) == {'uids', 'partition_codes', 'labels'}
          PY
          echo "decision=PASS_SRSA_STAGE1_DATA_SEAL" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: srsa-final-stage1-public-inputs
          path: srsa_stage1/public/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: srsa-final-stage1-sealed-labels
          path: srsa_stage1/sealed/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: srsa-final-stage1-lock
          path: srsa_stage1/SRSA_STAGE1_DATA_SEAL_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: srsa-final-stage1-log
          path: srsa-stage1.log
          if-no-files-found: error
          retention-days: 90

  stage2-endpoint:
    needs: stage1-seal
    if: needs.stage1-seal.outputs.decision == 'PASS_SRSA_STAGE1_DATA_SEAL'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {task: cifar100, model: cifar100_resnet20}
          - {task: cifar100, model: cifar100_vgg11_bn}
          - {task: cifar100, model: cifar100_mobilenetv2_x0_5}
          - {task: cifar100, model: cifar100_shufflenetv2_x0_5}
          - {task: cifar10, model: cifar10_resnet20}
          - {task: cifar10, model: cifar10_vgg11_bn}
          - {task: cifar10, model: cifar10_mobilenetv2_x0_5}
          - {task: cifar10, model: cifar10_shufflenetv2_x0_5}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU endpoint runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.6.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage0-lock
          path: locks/stage0
      - uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage1-lock
          path: locks/stage1
      - uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage1-public-inputs
          path: stage1_public
      - name: Assert this job received no label seal
        run: |
          set -euo pipefail
          if find stage1_public -type f -iname '*label*' | grep -q .; then exit 1; fi
      - name: Fetch the exact public model source commit
        run: |
          set -euo pipefail
          git init /tmp/pytorch-cifar-models
          git -C /tmp/pytorch-cifar-models remote add origin https://github.com/chenyaofo/pytorch-cifar-models.git
          git -C /tmp/pytorch-cifar-models fetch --depth=1 origin 786c16252c0fc58ee9adac063f8337cc4a7a497a
          git -C /tmp/pytorch-cifar-models checkout --detach FETCH_HEAD
          test "$(git -C /tmp/pytorch-cifar-models rev-parse HEAD)" = "786c16252c0fc58ee9adac063f8337cc4a7a497a"
      - name: Execute one clean endpoint without labels
        run: |
          set -euo pipefail
          python post_v20/srsa_cifar/srsa_stage2_endpoint.py \
            --task "${{ matrix.task }}" --model-name "${{ matrix.model }}" \
            --config post_v20/srsa_cifar/SRSA_CONFIG_2026-08-14.json \
            --stage0-lock locks/stage0/SRSA_STAGE0_FINAL_LOCK_2026-08-14.json \
            --stage1-lock locks/stage1/SRSA_STAGE1_DATA_SEAL_RECEIPT.json \
            --stage1-public-root stage1_public --model-repo /tmp/pytorch-cifar-models \
            --output endpoint_out 2>&1 | tee "srsa-stage2-${{ matrix.model }}.log"
          mkdir -p endpoint_artifact
          cp endpoint_out/receipt.json endpoint_artifact/receipt.json
          cp endpoint_out/predictions.npz endpoint_artifact/predictions.npz
          cp "srsa-stage2-${{ matrix.model }}.log" endpoint_artifact/execution.log
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}
          path: endpoint_artifact/
          if-no-files-found: error
          retention-days: 90

  stage2-close:
    needs: [stage0-lock, stage1-seal, stage2-endpoint]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      decision: ${{ steps.close.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage0-lock
          path: locks/stage0
      - uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage1-lock
          path: locks/stage1
      - uses: actions/download-artifact@v4
        with:
          pattern: cifar*
          path: stage2_endpoints
          merge-multiple: false
      - id: close
        name: Close the label-free endpoint family
        run: |
          set -euo pipefail
          python post_v20/srsa_cifar/srsa_stage2_close.py \
            --config post_v20/srsa_cifar/SRSA_CONFIG_2026-08-14.json \
            --stage0-lock locks/stage0/SRSA_STAGE0_FINAL_LOCK_2026-08-14.json \
            --stage1-lock locks/stage1/SRSA_STAGE1_DATA_SEAL_RECEIPT.json \
            --endpoints-root stage2_endpoints --output stage2_closure \
            2>&1 | tee srsa-stage2-closure.log
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('stage2_closure/SRSA_STAGE2_CLEAN_ENDPOINT_LEDGER.json').read_text())
          assert value['decision'] in {'PASS_SRSA_STAGE2_CLEAN_ENDPOINTS', 'STOP_SRSA_STAGE2_CLEAN_ENDPOINTS'}
          boundary = value['information_boundary']
          assert boundary['sealed_labels_accessed'] is False
          assert boundary['labels_accessed'] is False
          assert boundary['selector_executed'] is False
          Path('stage2-decision.txt').write_text(value['decision'] + '\n')
          PY
          echo "decision=$(cat stage2-decision.txt)" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: srsa-final-stage2-lock
          path: stage2_closure/SRSA_STAGE2_CLEAN_ENDPOINT_LEDGER.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: srsa-final-stage2-log
          path: srsa-stage2-closure.log
          if-no-files-found: error
          retention-days: 90

  stage3-preoutcome:
    needs: stage2-close
    if: needs.stage2-close.outputs.decision == 'PASS_SRSA_STAGE2_CLEAN_ENDPOINTS'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      decision: ${{ steps.preoutcome.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage0-lock
          path: locks/stage0
      - uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage1-lock
          path: locks/stage1
      - uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage2-lock
          path: locks/stage2
      - uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage1-public-inputs
          path: stage1_public
      - uses: actions/download-artifact@v4
        with:
          pattern: cifar*
          path: stage2_endpoints
          merge-multiple: false
      - name: Assert Stage 3 received no label seal
        run: |
          set -euo pipefail
          if find . -maxdepth 4 -type f -name 'labels.npz' | grep -q .; then exit 1; fi
      - id: preoutcome
        name: Freeze wrappers, pools, bindings, and Stage 4 code
        run: |
          set -euo pipefail
          python post_v20/srsa_cifar/srsa_stage3_preoutcome.py \
            --config post_v20/srsa_cifar/SRSA_CONFIG_2026-08-14.json \
            --stage0-lock locks/stage0/SRSA_STAGE0_FINAL_LOCK_2026-08-14.json \
            --stage1-lock locks/stage1/SRSA_STAGE1_DATA_SEAL_RECEIPT.json \
            --stage2-lock locks/stage2/SRSA_STAGE2_CLEAN_ENDPOINT_LEDGER.json \
            --stage1-public-root stage1_public --endpoints-root stage2_endpoints \
            --output stage3_out 2>&1 | tee srsa-stage3-preoutcome.log
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('stage3_out/SRSA_STAGE3_PREOUTCOME_LOCK.json').read_text())
          assert value['decision'] in {'PASS_SRSA_STAGE3_PREOUTCOME', 'STOP_SRSA_STAGE3_PREOUTCOME'}
          boundary = value['information_boundary']
          assert boundary['sealed_label_artifact_downloaded'] is False
          assert boundary['labels_accessed'] is False
          assert boundary['selector_executed'] is False
          Path('stage3-decision.txt').write_text(value['decision'] + '\n')
          PY
          echo "decision=$(cat stage3-decision.txt)" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: srsa-final-stage3-preoutcome
          path: |
            stage3_out/SRSA_STAGE3_PREOUTCOME_LOCK.json
            stage3_out/cifar100/preoutcome.npz
            stage3_out/cifar10/preoutcome.npz
            srsa-stage3-preoutcome.log
          if-no-files-found: error
          retention-days: 90

  stage4-outcome:
    needs: stage3-preoutcome
    if: needs.stage3-preoutcome.outputs.decision == 'PASS_SRSA_STAGE3_PREOUTCOME'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      decision: ${{ steps.outcome.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Guard the immutable source commit
        run: |
          set -euo pipefail
          test ! -e post_v20/srsa_cifar/SRSA_STAGE4_RESULT_2026-08-15.json
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage0-lock
          path: locks/stage0
      - uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage1-lock
          path: locks/stage1
      - uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage2-lock
          path: locks/stage2
      - uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage3-preoutcome
          path: stage3_preoutcome
      - uses: actions/download-artifact@v4
        with:
          pattern: cifar*
          path: stage2_endpoints
          merge-multiple: false
      - name: Verify the pre-outcome artifact before opening labels
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('stage3_preoutcome/SRSA_STAGE3_PREOUTCOME_LOCK.json').read_text())
          assert value['decision'] == 'PASS_SRSA_STAGE3_PREOUTCOME'
          assert Path('stage3_preoutcome/cifar100/preoutcome.npz').is_file()
          assert Path('stage3_preoutcome/cifar10/preoutcome.npz').is_file()
          PY
          test ! -e stage1_sealed
      - name: Download sealed labels in the single authorized job
        uses: actions/download-artifact@v4
        with:
          name: srsa-final-stage1-sealed-labels
          path: stage1_sealed
      - id: outcome
        name: Open labels once and execute every frozen condition
        run: |
          set -euo pipefail
          python post_v20/srsa_cifar/srsa_stage4_outcome.py \
            --config post_v20/srsa_cifar/SRSA_CONFIG_2026-08-14.json \
            --stage0-lock locks/stage0/SRSA_STAGE0_FINAL_LOCK_2026-08-14.json \
            --stage1-lock locks/stage1/SRSA_STAGE1_DATA_SEAL_RECEIPT.json \
            --stage2-lock locks/stage2/SRSA_STAGE2_CLEAN_ENDPOINT_LEDGER.json \
            --stage3-lock stage3_preoutcome/SRSA_STAGE3_PREOUTCOME_LOCK.json \
            --stage1-sealed-root stage1_sealed --endpoints-root stage2_endpoints \
            --preoutcome-root stage3_preoutcome --stage3-commit "${GITHUB_SHA}" \
            --output stage4_out 2>&1 | tee srsa-stage4-outcome.log
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('stage4_out/SRSA_STAGE4_RESULT.json').read_text())
          assert value['decision'] in {'GO_SRSA_PRIMARY', 'NO_GO_SRSA_PRIMARY'}
          assert value['information_boundary']['label_opening_jobs'] == 1
          assert value['information_boundary']['all_four_roots_executed_and_reported'] is True
          Path('stage4-decision.txt').write_text(value['decision'] + '\n')
          PY
          echo "decision=$(cat stage4-decision.txt)" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: srsa-final-stage4-result
          path: |
            stage4_out/SRSA_STAGE4_RESULT.json
            stage4_out/SRSA_STAGE4_PAIRED_RUNS.npz
            srsa-stage4-outcome.log
          if-no-files-found: error
          retention-days: 90
