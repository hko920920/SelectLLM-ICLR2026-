name: PRAA Stage 2 clean safety and parent selection

on:
  push:
    branches:
      - research/praa-admission-audit
    paths:
      - ".github/workflows/praa-stage2-clean-safety.yml"
      - "post_v20/praa_registry_admission/PRAA_STAGE1_ARTIFACT_AND_DATA_SEAL_LOCK_2026-08-14.json"
      - "post_v20/praa_registry_admission/PRAA_STAGE2_CLEAN_SAFETY_AND_PARENT_PROTOCOL_2026-08-14.md"
      - "post_v20/praa_registry_admission/stage2_clean_safety_endpoint.py"
      - "post_v20/praa_registry_admission/stage2_select_parent.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: praa-stage2-clean-safety
  cancel-in-progress: false

jobs:
  endpoint:
    name: safety-${{ matrix.root_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        root_id:
          - emotion-roberta-dk409
          - emotion-bert-nateraw
          - emotion-distilbert-bhadresh
          - emotion-albert-bhadresh
          - lid-xlmroberta-papluca
          - lid-fasttext-facebook
          - lid-fasttext-glotlid
          - lid-langid-package
    env:
      HF_HOME: /tmp/praa-stage2-huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout frozen branch without LFS objects
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Stage-1 public input artifact
        uses: actions/download-artifact@v4
        with:
          name: praa-stage1-public-artifact-and-inputs
          path: stage1_public
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31775680237

      - name: Install deterministic endpoint runtimes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            torch==2.6.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            transformers==4.56.2 \
            tokenizers==0.22.2 \
            safetensors==0.8.0 \
            sentencepiece==0.2.0 \
            huggingface-hub==0.34.5 \
            fasttext-wheel==0.9.2
          mkdir -p /tmp/praa-langid-dist
          python -m pip download --disable-pip-version-check \
            --no-deps --no-binary=:all: \
            langid==1.1.6 \
            -d /tmp/praa-langid-dist
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('/tmp/praa-langid-dist/langid-1.1.6.tar.gz')
          expected = '044bcae1912dab85c33d8e98f2811b8f4ff1213e5e9a9e9510137b84da2cb293'
          observed = hashlib.sha256(path.read_bytes()).hexdigest()
          if observed != expected:
              raise SystemExit({'expected': expected, 'observed': observed})
          print({'langid_distribution_sha256': observed})
          PY
          python -m pip install --disable-pip-version-check \
            /tmp/praa-langid-dist/langid-1.1.6.tar.gz

      - name: Run frozen safety endpoint without labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage2_out
          python post_v20/praa_registry_admission/stage2_clean_safety_endpoint.py \
            --root-id "${{ matrix.root_id }}" \
            --stage1-public-root stage1_public \
            --output-root stage2_out \
            | tee "stage2-${{ matrix.root_id }}.log"

      - name: Upload safety endpoint receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: praa-stage2-safety-${{ matrix.root_id }}
          path: |
            stage2_out/
            stage2-${{ matrix.root_id }}.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  parent:
    name: clean-registry-certification
    needs: endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HOME: /tmp/praa-stage2-parent-huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout frozen branch without LFS objects
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Stage-1 public input artifact
        uses: actions/download-artifact@v4
        with:
          name: praa-stage1-public-artifact-and-inputs
          path: stage1_public
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31775680237

      - name: Download all safety endpoint receipts
        uses: actions/download-artifact@v4
        with:
          pattern: praa-stage2-safety-*
          path: stage2_predictions
          merge-multiple: true

      - name: Install safety-label reconstruction dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            datasets==5.0.1 \
            pyarrow==25.0.0 \
            huggingface-hub==0.34.5

      - name: Certify clean registries and select deterministic parents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage2_ledger
          python post_v20/praa_registry_admission/stage2_select_parent.py \
            --stage1-public-root stage1_public \
            --predictions-root stage2_predictions \
            --output-dir stage2_ledger \
            | tee stage2_ledger/execution.log

      - name: Upload Stage-2 parent-selection ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: praa-stage2-clean-safety-and-parent-ledger
          path: stage2_ledger/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
