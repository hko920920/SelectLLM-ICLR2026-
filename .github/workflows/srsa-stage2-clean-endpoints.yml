name: SRSA Stage 2 clean endpoints

on:
  push:
    branches:
      - research/srsa-cifar-audit
    paths:
      - "post_v20/srsa_cifar/SRSA_STAGE2_AUTHORIZE_2026-08-14.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: srsa-stage2-clean-endpoints
  cancel-in-progress: false

jobs:
  endpoint:
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: cifar100
            model: cifar100_resnet20
          - task: cifar100
            model: cifar100_vgg11_bn
          - task: cifar100
            model: cifar100_mobilenetv2_x0_5
          - task: cifar100
            model: cifar100_shufflenetv2_x0_5
          - task: cifar10
            model: cifar10_resnet20
          - task: cifar10
            model: cifar10_vgg11_bn
          - task: cifar10
            model: cifar10_mobilenetv2_x0_5
          - task: cifar10
            model: cifar10_shufflenetv2_x0_5
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned CPU endpoint runtime
        run: |
          python -m pip install --disable-pip-version-check \
            torch==2.6.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==1.26.4

      - name: Download Stage 1 public inputs only
        run: |
          set -euo pipefail
          run_id=$(python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('post_v20/srsa_cifar/SRSA_STAGE1_FINAL_LOCK_2026-08-14.json').read_text(encoding='utf-8'))
          assert value['decision'] == 'PASS_SRSA_STAGE1_DATA_SEAL'
          print(value['authoritative_execution']['run_id'])
          PY
          )
          gh run download "${run_id}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name srsa-stage1-public-inputs \
            --dir stage1_public
          test ! -e stage1_public/sealed
          if find stage1_public -type f -iname '*label*' | grep -q .; then
            echo 'public artifact unexpectedly contains a label-named file' >&2
            exit 1
          fi

      - name: Fetch exact public model source commit
        run: |
          set -euo pipefail
          git init /tmp/pytorch-cifar-models
          git -C /tmp/pytorch-cifar-models remote add origin https://github.com/chenyaofo/pytorch-cifar-models.git
          git -C /tmp/pytorch-cifar-models fetch --depth=1 origin 786c16252c0fc58ee9adac063f8337cc4a7a497a
          git -C /tmp/pytorch-cifar-models checkout --detach FETCH_HEAD
          test "$(git -C /tmp/pytorch-cifar-models rev-parse HEAD)" = "786c16252c0fc58ee9adac063f8337cc4a7a497a"

      - name: Execute one frozen clean endpoint without labels
        run: |
          set -euo pipefail
          python post_v20/srsa_cifar/srsa_stage2_endpoint.py \
            --task "${{ matrix.task }}" \
            --model-name "${{ matrix.model }}" \
            --config post_v20/srsa_cifar/SRSA_CONFIG_2026-08-14.json \
            --stage0-lock post_v20/srsa_cifar/SRSA_STAGE0_FINAL_LOCK_2026-08-14.json \
            --stage1-lock post_v20/srsa_cifar/SRSA_STAGE1_FINAL_LOCK_2026-08-14.json \
            --stage1-public-root stage1_public \
            --model-repo /tmp/pytorch-cifar-models \
            --output endpoint_out \
            2>&1 | tee "srsa-stage2-${{ matrix.model }}.log"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}
          path: |
            endpoint_out/
            srsa-stage2-${{ matrix.model }}.log
          if-no-files-found: error
          retention-days: 90

  family-closure:
    needs: endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned closure runtime
        run: python -m pip install --disable-pip-version-check numpy==1.26.4

      - name: Download all eight endpoint artifacts from this run
        uses: actions/download-artifact@v4
        with:
          pattern: cifar*
          path: stage2_endpoints
          merge-multiple: false

      - name: Close the label-free endpoint family
        run: |
          set -euo pipefail
          python post_v20/srsa_cifar/srsa_stage2_close.py \
            --config post_v20/srsa_cifar/SRSA_CONFIG_2026-08-14.json \
            --stage0-lock post_v20/srsa_cifar/SRSA_STAGE0_FINAL_LOCK_2026-08-14.json \
            --stage1-lock post_v20/srsa_cifar/SRSA_STAGE1_FINAL_LOCK_2026-08-14.json \
            --endpoints-root stage2_endpoints \
            --output stage2_closure \
            2>&1 | tee srsa-stage2-closure.log

      - name: Assert no outcome access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('stage2_closure/SRSA_STAGE2_CLEAN_ENDPOINT_LEDGER.json').read_text(encoding='utf-8'))
          assert value['decision'] in {
              'PASS_SRSA_STAGE2_CLEAN_ENDPOINTS',
              'STOP_SRSA_STAGE2_CLEAN_ENDPOINTS',
          }
          boundary = value['information_boundary']
          assert boundary['sealed_labels_accessed'] is False
          assert boundary['labels_accessed'] is False
          assert boundary['structured_wrappers_constructed'] is False
          assert boundary['selector_executed'] is False
          assert boundary['candidate_quality_computed'] is False
          assert boundary['primary_or_deployment_outcome_opened'] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: srsa-stage2-clean-endpoint-ledger
          path: |
            stage2_closure/SRSA_STAGE2_CLEAN_ENDPOINT_LEDGER.json
            srsa-stage2-closure.log
          if-no-files-found: error
          retention-days: 90
