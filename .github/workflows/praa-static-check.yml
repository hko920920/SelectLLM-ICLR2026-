name: PRAA static protocol and code checks

on:
  push:
    branches:
      - research/praa-admission-audit
    paths:
      - ".github/workflows/praa-static-check.yml"
      - "post_v20/praa_registry_admission/*.py"
      - "post_v20/praa_registry_admission/*.json"
      - "post_v20/praa_registry_admission/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: praa-static-check
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all PRAA Python sources
        run: |
          python -m compileall -q post_v20/praa_registry_admission

      - name: Parse every PRAA JSON file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('post_v20/praa_registry_admission').glob('*.json'))
          if not files:
              raise SystemExit('no PRAA JSON files found')
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
              print(path)
          PY

      - name: Assert scientific boundary documents exist
        run: |
          test -f post_v20/praa_registry_admission/PRAA_PROSPECTIVE_ATTEMPT_REGISTER_2026-08-14.md
          test -f post_v20/praa_registry_admission/PRAA_ROOT_AWARE_ADMISSION_POLICY_V1.md
          test -f post_v20/praa_registry_admission/PRAA_STAGE3_ERROR_HEAD_AND_THRESHOLD_PROTOCOL_2026-08-14.md
          test -f post_v20/praa_registry_admission/PRAA_PRIMARY_AND_DEPLOYMENT_DECISION_PROTOCOL_2026-08-14.md
