name: V21 public OpenReview audit

on:
  push:
    branches: [paper/v21-calibrated]
    paths:
      - "docs/v21/OPENREVIEW_AUDIT_TRIGGER.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests==2.32.5
      - name: Fetch public submission threads by exact title
        run: |
          python - <<'PY'
          import json, urllib.parse
          from pathlib import Path
          import requests

          titles = [
            "Clone-Robust AI Alignment",
            "Dropping Just a Handful of Preferences Can Change Top Large Language Model Rankings",
            "How Reliable is Language Model Micro-Benchmarking?",
            "The Leaderboard Illusion",
            "All Models Are Wrong, Some Are Useful: Model Selection with Limited Labels",
            "Strategic Candidacy in Generative AI Arenas",
            "Active Evaluation of General Agents: Problem Definition and Comparison of Baseline Algorithms",
          ]
          bases = ["https://api2.openreview.net/notes", "https://api.openreview.net/notes"]
          out = Path("openreview_audit")
          out.mkdir()
          index = {"records": {}, "failures": {}}
          session = requests.Session()
          session.headers.update({
            "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36",
            "Accept": "application/json,text/plain,*/*",
            "Referer": "https://openreview.net/",
            "Origin": "https://openreview.net",
          })

          def val(x):
            return x.get("value") if isinstance(x, dict) and "value" in x else x

          def retrieve(params):
            errors = []
            for base in bases:
              try:
                response = session.get(base, params=params, timeout=60)
                if response.status_code != 200:
                  errors.append(f"{base}: HTTP {response.status_code}: {response.text[:160]}")
                  continue
                payload = response.json()
                if isinstance(payload, dict) and "notes" in payload:
                  return base, payload["notes"]
                errors.append(f"{base}: missing notes key")
              except Exception as exc:
                errors.append(f"{base}: {type(exc).__name__}: {exc}")
            raise RuntimeError(" | ".join(errors))

          for title in titles:
            try:
              base, notes = retrieve({"content.title": title, "limit": 1000})
              matches = [n for n in notes if str(val(n.get("content", {}).get("title", ""))).strip() == title]
              if not matches:
                raise RuntimeError(f"no exact title match from {base}; returned={len(notes)}")
              submission = sorted(matches, key=lambda n: int(n.get("pdate") or n.get("cdate") or 0), reverse=True)[0]
              forum = submission["id"]
              forum_base, forum_notes = retrieve({"forum": forum, "limit": 1000})
              slug = "".join(c.lower() if c.isalnum() else "-" for c in title).strip("-")[:100]
              (out / f"{slug}.json").write_text(json.dumps({"submission": submission, "notes": forum_notes}, indent=2, ensure_ascii=False) + "\n")
              index["records"][title] = {"lookup_api": base, "forum_api": forum_base, "forum": forum, "notes": len(forum_notes), "file": f"{slug}.json"}
            except Exception as e:
              index["failures"][title] = f"{type(e).__name__}: {e}"
          (out / "index.json").write_text(json.dumps(index, indent=2, ensure_ascii=False) + "\n")
          print(json.dumps(index, indent=2, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v21-openreview-audit
          path: openreview_audit/
          if-no-files-found: error
          retention-days: 30
