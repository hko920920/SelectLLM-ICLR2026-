name: SRSA protocol and core invariance checks

on:
  push:
    branches:
      - research/srsa-cifar-audit
    paths:
      - ".github/workflows/srsa-static-check.yml"
      - ".github/workflows/srsa-one-shot.yml"
      - "post_v20/srsa_cifar/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srsa-static-check
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            pytest==8.3.5 \
            PyYAML==6.0.2

      - name: Compile SRSA Python sources
        run: python -m compileall -q post_v20/srsa_cifar

      - name: Parse frozen configuration and workflow syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          config_path = Path('post_v20/srsa_cifar/SRSA_CONFIG_2026-08-14.json')
          value = json.loads(config_path.read_text(encoding='utf-8'))
          assert value['status'] == 'PREREGISTERED_BEFORE_CIFAR_EXECUTION'
          assert value['tasks']['cifar100']['role'] == 'primary'
          assert value['tasks']['cifar10']['role'] == 'replication_non_substitutable'
          assert value['development_disclosure']['selected_variant_rate'] == 0.05
          assert value['response']['alias_count'] == 4
          assert value['attack_family']['attacked_roots'] == 'all four fixed roots'
          assert value['selector']['budget'] == 2
          assert value['closure']['no_third_task'] is True
          workflow_path = Path('.github/workflows/srsa-one-shot.yml')
          workflow = yaml.safe_load(workflow_path.read_text(encoding='utf-8'))
          assert isinstance(workflow, dict)
          assert 'jobs' in workflow
          assert set(workflow['jobs']) == {
              'stage0-lock',
              'stage1-seal',
              'stage2-endpoint',
              'stage2-close',
              'stage3-preoutcome',
              'stage4-outcome',
          }
          print(config_path)
          print(workflow_path)
          PY

      - name: Assert protocol, boundary, and execution files exist
        run: |
          test -f post_v20/srsa_cifar/SRSA_PROTOCOL_2026-08-14.md
          test -f post_v20/srsa_cifar/SRSA_ATTEMPT_REGISTER_2026-08-14.md
          test -f post_v20/srsa_cifar/SRSA_THEORY_UPGRADE_2026-08-14.md
          test -f post_v20/srsa_cifar/SRSA_TECHNICAL_DEFECT_LEDGER_2026-08-14.md
          test -f post_v20/srsa_cifar/srsa_selector_frozen.py
          test -f post_v20/srsa_cifar/srsa_stage3_preoutcome.py
          test -f post_v20/srsa_cifar/srsa_stage4_outcome.py
          test ! -f post_v20/srsa_cifar/SRSA_STAGE4_RESULT_2026-08-15.json

      - name: Run all pre-outcome mechanics and statistical tests
        working-directory: post_v20/srsa_cifar
        run: |
          pytest -q \
            test_srsa_core.py \
            test_srsa_selector_fast.py \
            test_srsa_selector_frozen.py \
            test_srsa_stage4_math.py
