name: SRSA protocol and core invariance checks

on:
  push:
    branches:
      - research/srsa-cifar-audit
    paths:
      - ".github/workflows/srsa-static-check.yml"
      - "post_v20/srsa_cifar/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srsa-static-check
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic test dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 pytest==8.3.5

      - name: Compile SRSA Python sources
        run: python -m compileall -q post_v20/srsa_cifar

      - name: Parse frozen configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('post_v20/srsa_cifar/SRSA_CONFIG_2026-08-14.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          assert value['status'] == 'PREREGISTERED_BEFORE_CIFAR_EXECUTION'
          assert value['tasks']['cifar100']['role'] == 'primary'
          assert value['tasks']['cifar10']['role'] == 'replication_non_substitutable'
          assert value['development_disclosure']['selected_variant_rate'] == 0.05
          assert value['response']['alias_count'] == 4
          assert value['attack_family']['attacked_roots'] == 'all four fixed roots'
          assert value['closure']['no_third_task'] is True
          print(path)
          PY

      - name: Assert boundary documents exist
        run: |
          test -f post_v20/srsa_cifar/SRSA_PROTOCOL_2026-08-14.md
          test -f post_v20/srsa_cifar/SRSA_ATTEMPT_REGISTER_2026-08-14.md
          test -f post_v20/srsa_cifar/SRSA_THEORY_UPGRADE_2026-08-14.md

      - name: Run typed-similarity and invariance tests
        working-directory: post_v20/srsa_cifar
        run: pytest -q test_srsa_core.py
